name: Extract Starter Project

on:
  workflow_dispatch:
  push:
    paths:
      - "maestro-device-control-starter.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p _extract
          unzip -o maestro-device-control-starter.zip -d _extract
          cp -R _extract/maestro-device-control-starter/. .
          rm -rf _extract
          rm -f maestro-device-control-starter.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract starter project" || exit 0
          git push
